# https://gist.github.com/spicycode/1229612
# music https://www.tylerewing.co/tmux-now-playing
# vars https://www.cyberciti.biz/tips/howto-linux-unix-bash-shell-setup-prompt.html

# global
    set -g base-index 1
    set -g default-terminal screen-256color
    set -g status-keys vi
    set -g history-limit 10000

    # No delay for escape key press
    set -sg escape-time 0

    # Automatically set window title
    set-window-option -g automatic-rename on
    set-option -g set-titles on

    # vi-mode
    setw -g mode-keys vi
    set -g status-keys vi


# bindings
    unbind C-b          # Ctrl+b —> not the prefix anymore (was tmux's default)
    set -g prefix =     # = —> prefix: press it, then one of the keys below
    bind = send-prefix  # = then = —> type a literal "=" (since = is the prefix)

    # panes
    bind a select-pane -L  # = then a —> move to the pane on the left
    bind d select-pane -R  # = then d —> move to the pane on the right
    bind w select-pane -U  # = then w —> move to the pane above
    bind s select-pane -D  # = then s —> move to the pane below

    bind-key Left resize-pane -L 5   # = then Left arrow —> resize: move the pane border 5 columns left
    bind-key Right resize-pane -R 5  # = then Right arrow —> resize: move the pane border 5 columns right
    bind-key Up resize-pane -U 5     # = then Up arrow —> resize: move the pane border 5 rows up
    bind-key Down resize-pane -D 5   # = then Down arrow —> resize: move the pane border 5 rows down

    bind v split-window -h -c '#{pane_current_path}'  # = then v —> split: new pane to the right, in the current dir
    bind h split-window -v -c '#{pane_current_path}'  # = then h —> split: new pane below, in the current dir
    bind k kill-pane                                  # = then k —> close the current pane (no confirmation)

    # tabs
    bind N new-window       # = then Shift+n —> open a new window
    bind A previous-window  # = then Shift+a —> go to the previous window
    bind D next-window      # = then Shift+d —> go to the next window
    bind K kill-window      # = then Shift+k —> close the current window and its panes (no confirmation)

    # space
    bind Space choose-session  # = then Space —> choose a session to switch to

    bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."  # = then r —> reload the config

# theme
    source-file ~/.dotfiles/tmux/statusline.conf
    set -g status-interval 2
    set -g pane-border-style fg=colour088
    set -g pane-active-border-style fg=colour032
