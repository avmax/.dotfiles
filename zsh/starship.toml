"$schema" = "https://starship.rs/config-schema.json"

# Two-line prompt, linked to ~/.config/starship.toml by install/zsh.sh:
#
#   line 1:  OS · RAM · local IP · node version            git (right-aligned)
#   line 2:  current directory, prompt character
#
# Symbols are plain Unicode that macOS fonts render, so any terminal font works.

add_newline = true
command_timeout = 1000   # ms; a slow git/node probe must not hang the prompt

format = """
$os$memory_usage$localip$nodejs$hostname$fill$cmd_duration$jobs$git_branch$git_state$git_status
$directory$character"""

[fill]
symbol = " "

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold"

[os.symbols]
Macos = ""

[memory_usage]
disabled = false
threshold = -1           # always show, like the old ram segment
format = "[ram $ram_pct]($style) "
style = "blue"

[localip]
disabled = false
ssh_only = false
format = "[$localipv4]($style) "
style = "blue"

[nodejs]
format = "[⬢ $version]($style) "
style = "green"

[hostname]
format = "[@$hostname]($style) "   # only over ssh (the default)

[cmd_duration]
format = "[took $duration]($style) "
style = "yellow"

[git_branch]
format = "[⎇ $branch]($style) "
style = "bold purple"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold red"

[directory]
truncation_length = 4
truncate_to_repo = false
truncation_symbol = "…/"
style = "bold blue"
read_only = " ro"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
